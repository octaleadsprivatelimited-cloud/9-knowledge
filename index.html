<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9knowledge - Your Trusted Source for News & Insights</title>
    <meta name="description" content="9knowledge delivers insightful articles on technology, health, business, science, and more. Stay informed with our trusted news and expert analysis." />
    <meta name="keywords" content="news, technology, health, business, science, education, finance, lifestyle, travel" />
    <meta name="author" content="9knowledge" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="9knowledge - Your Trusted Source for News & Insights" />
    <meta property="og:description" content="9knowledge delivers insightful articles on technology, health, business, science, and more." />
    <meta property="og:url" content="https://9knowledge.com" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="9knowledge - Your Trusted Source for News & Insights" />
    <meta name="twitter:description" content="9knowledge delivers insightful articles on technology, health, business, science, and more." />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://9knowledge.com" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://translate.google.com" />
    <link rel="dns-prefetch" href="https://translate.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    
    <!-- Fonts: load without blocking first paint (display=swap avoids invisible text) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" /></noscript>
    <!-- Start loading app early (type=module defers execution until HTML parsed) -->
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;font-family:system-ui,sans-serif">
        <div style="font-size:1.5rem;font-weight:700;color:#1a1a1a">9</div>
        <div style="margin-top:0.75rem;height:1.5rem;width:1.5rem;border:2px solid #1a1a1a;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></div>
      </div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </body>
</html>
